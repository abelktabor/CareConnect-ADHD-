name: Flutter mobile

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/mobile-flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/mobile-flutter/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile-flutter

jobs:
  quality:
    name: Analyze · Test · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos

      - name: Dependency advisories
        run: dart pub outdated --show-all || true

      - name: Unit + widget tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Enforce 60% coverage floor (Assignment 4)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov >/dev/null
          lcov --summary coverage/lcov.info | tee coverage/summary.txt
          PCT=$(grep -E "lines\.*:" coverage/summary.txt | sed -E 's/.*: ([0-9.]+)%.*/\1/')
          echo "line coverage: $PCT%"
          awk -v p="$PCT" 'BEGIN { if (p+0 < 60) { print "coverage below 60%"; exit 1 } }'

      - name: HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html --title "CareConnect mobile" --quiet

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-html
          path: apps/mobile-flutter/coverage/html
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: careconnect-mobile-release-apk
          path: apps/mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
